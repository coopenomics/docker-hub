services:
  node:
    image: ${BLOCKCHAIN_IMAGE:-dicoop/blockchain}:${BLOCKCHAIN_TAG:-latest}
    container_name: coopos-node
    ports:
      - "${NODE_HTTP_PORT:-8888}:8888"
      - "${NODE_P2P_PORT:-9876}:9876"
      - "${NODE_HISTORY_PORT:-8088}:8080"
    volumes:
      - ./config:/root/blockchain/config
      - ./data:/root/blockchain/data
      - ./snapshot.bin:/root/blockchain/snapshot.bin:ro
    environment:
      EXTRA_ARGS: ${EXTRA_ARGS:-}
    command:
      - /bin/sh
      - -c
      - 'exec /usr/local/bin/nodeos --config-dir /root/blockchain/config --data-dir /root/blockchain/data ${EXTRA_ARGS}'
    restart: unless-stopped
